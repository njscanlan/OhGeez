<html lang="en">
<head>

<meta name="theme-color" content="#1E7366">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Oh Geez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one calm phone column, sticky header, bottom tab bar; cards only where something needs a tap. */
:root{
  --bg:#EEF4F2; --surface:#FFFFFF; --ink:#16302B; --muted:#5A6E69; --line:#D5E2DE;
  --teal:#1E7366; --teal-soft:#D9EEE9; --sun:#F2A93B; --sun-soft:#FDF0D8;
  --ok:#2E8B57; --warn:#C27A0E; --bad:#C2452D; --bad-soft:#FBE3DD;
  --display:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A18; --surface:#172623; --ink:#E4EFEC; --muted:#9AB0AA; --line:#2A3D39;
  --teal:#5CC2B0; --teal-soft:#1E3A35; --sun:#F5B858; --sun-soft:#3A2E17;
  --ok:#5FC28A; --warn:#E5A743; --bad:#F07F68; --bad-soft:#3E211B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A18; --surface:#172623; --ink:#E4EFEC; --muted:#9AB0AA; --line:#2A3D39;
  --teal:#5CC2B0; --teal-soft:#1E3A35; --sun:#F5B858; --sun-soft:#3A2E17;
  --ok:#5FC28A; --warn:#E5A743; --bad:#F07F68; --bad-soft:#3E211B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:900;font-size:26px;letter-spacing:-.01em}
.brand span{color:var(--sun)}
.who{font-size:13px;color:var(--muted)}
h2{font-family:var(--display);font-weight:800;font-size:20px;margin:22px 0 10px;text-wrap:balance}
h3{font-family:var(--display);font-weight:800;font-size:16px;margin:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.banner{background:var(--sun-soft);border-radius:12px;padding:10px 12px;font-size:13px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 12px;min-height:40px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--surface);font-weight:600}
.btn-ghost{background:transparent}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Today progress */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px}
.big{font-family:var(--display);font-weight:900;font-size:30px;line-height:1}
.feed{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;background:var(--teal-soft);color:var(--teal)}
.feed.done .dot{background:var(--teal);color:var(--surface)}
.feed-body{min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:7px 12px;min-height:36px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;font-size:13px}
.quick b{font-family:var(--display);font-size:18px}
.log{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.log:first-child{border-top:0}
.log .x{min-height:30px;padding:2px 8px;border:0;background:transparent;color:var(--muted)}

/* Supplies */
.sup{display:flex;flex-direction:column;gap:8px}
.sup-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--teal-soft);color:var(--ok)}
.pill.soon{background:var(--sun-soft);color:var(--warn)}
.pill.now{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.bar.soon i{background:var(--sun)} .bar.now i{background:var(--bad)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;padding:0}

/* Brief */
.brief section{padding:12px 0;border-top:1px solid var(--line)}
.brief section:first-child{border-top:0;padding-top:0}
.brief ol,.brief ul{margin:6px 0 0;padding-left:20px}
.brief li{margin:4px 0}
dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
dt{color:var(--muted)} dd{margin:0;min-width:0}
details{border-top:1px solid var(--line);padding:8px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600}

/* Tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav .tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:transparent;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:8px 4px;min-height:56px}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--teal);font-weight:600}
.daynav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin-top:14px}
.daynav > button{font-size:24px;padding:0;line-height:1}
.linkish{border:0;background:none;color:var(--teal);padding:0;min-height:0;font-weight:600;text-decoration:underline}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.dayc{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;min-height:0;font-size:11px;color:var(--muted)}
.dayc b{font-size:15px;color:var(--ink)} .dayc i{font-style:normal;font-size:11px}
.dayc i.ok{color:var(--ok)} .dayc i.mid{color:var(--warn)} .dayc i.over{color:var(--warn)}
.dayc.on{background:var(--teal);border-color:var(--teal)} .dayc.on, .dayc.on b, .dayc.on i{color:var(--surface)}
.cd{display:flex;flex-direction:column;gap:8px;border-width:2px;border-color:var(--teal)}
.cd.soon{border-color:var(--sun);background:var(--sun-soft)} .cd.now{border-color:var(--bad);background:var(--bad-soft)}
.cd-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cd-big{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;color:var(--teal)}
.cd.soon .cd-big{color:var(--warn)} .cd.now .cd-big{color:var(--bad)}
.cd-sub{color:var(--muted);font-weight:600}
.cd-mini{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:0;margin:10px 0;color:var(--ink)}
.cd-mini.now{background:var(--bad-soft)}
.welcome{border:2px solid var(--teal);margin-top:14px}
.btnlike{display:inline-flex;align-items:center;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 12px;min-height:40px}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;z-index:9}
.guard{font-size:12px;color:var(--muted);border-left:3px solid var(--sun);padding-left:10px}
@media (prefers-reduced-motion:no-preference){.ring circle{transition:stroke-dashoffset .5s ease}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Oh Geez<span>.</span></div>
    <div class="who" id="who">Feeds and supplies, kept on this phone</div>
  </header>
  <div id="notice" class="banner" hidden></div>
  <main id="view"></main>
</div>

<nav aria-label="Sections"><div class="tabs">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button data-tab="supplies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>Supplies</button>
  <button data-tab="brief"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h4"/></svg>Brief</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Plan</button>
</div></nav>
<div id="toast" class="toast" hidden role="status"></div>

<script>
const S = { tab:"today", plan:null, brief:null, supplies:{}, logs:[], loaded:false, db:null, me:"", open:null };
const SUP_ORDER = ["bags","extsets","syringes","syringe10","syringe30","gentlease","compleat"];
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayKey = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmtTime = ts => new Date(ts).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
const fmtDate = d => d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
const hhmm = ts => { const d=new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const tsFrom = (base, t) => { const d=new Date(base); const m=/^(\d{1,2}):(\d{2})/.exec(t||""); if(m) d.setHours(+m[1], +m[2], 0, 0); return d.getTime(); };
const UNITS=["oz","tsp","tbsp","pieces"];
const fmtOz = n => (Math.round(n*100)/100).toString();
function foodForm(key,d){
  const names=[...new Set(S.logs.filter(l=>(l.type==="food"||l.type==="oral")&&l.food).map(l=>l.food))].slice(0,30);
  return `<div class="stack" style="margin-top:4px">
    <label for="fname">Food<input id="fname" list="foodlist" value="${esc(d.food||"")}" placeholder="e.g. Level 4 sweet potato purée, puffs, yogurt melts"></label>
    <datalist id="foodlist">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    <div class="grid2"><label for="famt">Amount<input id="famt" type="number" step="0.05" inputmode="decimal" value="${esc(d.amount??"")}" placeholder="0.5"></label>
      <label for="ftime2">Time<input id="ftime2" type="time" value="${hhmm(d.ts||nowOnDay())}"></label></div>
    <div class="chips" id="funit">${UNITS.map(u=>`<button class="chip" aria-pressed="${u===(d.unit||"oz")}" data-val="${u}">${u}</button>`).join("")}</div>
    <div><div class="eyebrow" style="margin-bottom:6px">How did she do</div><div class="chips" id="fhow">
      ${["Great","Okay","Rough"].map(h=>`<button class="chip" aria-pressed="${h===(d.how||"Great")}" data-val="${h}">${h}</button>`).join("")}</div></div>
    <label for="fnote2">Note (optional)<input id="fnote2" value="${esc(d.note||"")}" placeholder="Coughing, pocketing food, loved it..."></label>
    <div class="row"><button class="btn-primary" data-act="savefood" data-key="${esc(key)}">Save food</button>
      ${key.startsWith("edit:")?`<button class="btn-ghost" data-act="undo" data-id="${esc(key.slice(5))}">Remove</button>`:""}</div></div>`;
}
function viewKey(){ return S.viewDay || dayKey(); }
function keyToDate(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function nowOnDay(){ if(!S.viewDay || S.viewDay===dayKey()) return Date.now(); const d=keyToDate(S.viewDay), n=new Date(); d.setHours(n.getHours(), n.getMinutes(), 0, 0); return d.getTime(); }
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,1800); }

/* ---------- data: saved only on this device ---------- */
const LS_KEY="ohgeez:v1";
const LocalDB = (()=>{
  let docs={};
  try{ docs=JSON.parse(localStorage.getItem(LS_KEY)||"{}")||{}; }catch(e){ docs={}; S.storageBroken=true; }
  const subs=new Set();
  const clone=d=>JSON.parse(JSON.stringify(d));
  const persist=()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify(docs)); }catch(e){ toast("Couldn't save on this device. Storage may be full or blocked."); throw e; } };
  const emit=()=>subs.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } });
  const query=(coll, ord)=>{ let ds=Object.keys(docs).filter(k=>k.startsWith(coll+"/")&&k.split("/").length===2).map(k=>({id:k.slice(coll.length+1), data:()=>docs[k]}));
    if(ord){ const [f,dir]=ord; ds.sort((a,b)=>{ const x=a.data()[f], y=b.data()[f]; return (x<y?-1:x>y?1:0)*(dir==="desc"?-1:1); }); } return {docs:ds}; };
  return {
    doc(path){ return {
      onSnapshot(cb){ const f=()=>cb({exists: path in docs, data:()=>docs[path]}); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f); },
      async set(d){ docs[path]=clone(d); persist(); emit(); },
      async update(f){ docs[path]={...(docs[path]||{}), ...clone(f)}; persist(); emit(); },
      async delete(){ delete docs[path]; persist(); emit(); } }; },
    collection(name){ let ord=null; const q={
      orderBy(f,dir){ ord=[f,dir]; return q; }, limit(){ return q; },
      onSnapshot(cb){ const f=()=>cb(query(name,ord)); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f); },
      async add(d){ const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8); docs[name+"/"+id]=clone(d); persist(); emit(); return {id}; } }; return q; },
    all(){ return clone(docs); },
    replaceAll(nd){ docs=clone(nd); persist(); emit(); }
  };
})();
async function boot(){
  render();
  if(S.storageBroken) showNotice("This browser is blocking storage, so entries won't be kept. Try Safari or Chrome outside of private browsing.");
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  const db = LocalDB; S.db = db;
  let got = 0; const done = () => { if(++got>=4){ S.loaded=true; render(); } };
  db.doc("app/settings").onSnapshot(s => { S.settings = s.exists ? s.data() : {}; S.me = S.settings.caregiverName || ""; done.t ? render() : (done.t=1, done()); });
  db.doc("app/plan").onSnapshot(s => { S.plan = s.exists ? s.data() : null; done.p ? render() : (done.p=1, done()); });
  db.doc("app/brief").onSnapshot(s => { S.brief = s.exists ? s.data() : null; done.b ? render() : (done.b=1, done()); });
  db.collection("orders").orderBy("date","desc").onSnapshot(q => { S.orders = q.docs.map(d=>({id:d.id, ...d.data()})); render(); });
  db.collection("supplies").onSnapshot(q => { S.supplies={}; q.docs.forEach(d=>S.supplies[d.id]={...d.data(), id:d.id}); done.s ? render() : (done.s=1, done()); });
  db.collection("logs").orderBy("ts","desc").onSnapshot(q => { S.logs = q.docs.map(d=>({id:d.id, ...d.data()})); render(); });
  if("serviceWorker" in navigator && location.protocol==="https:"){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
}
function showNotice(m){ const n=$("#notice"); n.innerHTML=m; n.hidden=false; }
function hideNotice(){ $("#notice").hidden=true; }

async function addLog(entry){
  const e = { ts: Date.now(), by: S.me || "", ...entry }; e.day = dayKey(new Date(e.ts));
  if(!S.db){ S.logs.unshift({id:"local"+e.ts, ...e}); render(); toast("Logged (not saved)"); return; }
  try{ await S.db.collection("logs").add(e); toast("Logged"); }catch(x){ toast("Couldn't save. Try again."); }
}
async function updateLog(id, fields){
  if(fields.ts) fields.day = dayKey(new Date(fields.ts));
  if(!S.db){ const l=S.logs.find(x=>x.id===id); if(l) Object.assign(l,fields); render(); return; }
  try{ await S.db.doc("logs/"+id).update(fields); toast("Updated"); }catch(x){ toast("Couldn't update. Try again."); }
}
async function delLog(id){
  if(!S.db){ S.logs = S.logs.filter(l=>l.id!==id); render(); return; }
  try{ await S.db.doc("logs/"+id).delete(); toast("Removed"); }catch(x){ toast("Couldn't remove"); }
}
async function saveDoc(path, data, msg){
  if(!S.db){ toast("Saving is off in this view"); return; }
  const clean={...data}; if(path.startsWith("supplies/")) delete clean.id;
  try{ await S.db.doc(path).set(clean); if(msg) toast(msg); }catch(x){ toast("Couldn't save. Try again."); }
}

/* ---------- derived ---------- */
const plan = () => S.plan || { feedsPerDay:3, volumeMl:0, rateMlHr:0, waterMl:0, feedLabels:["Morning","Midday","Evening"] };
const cfg = () => S.settings || {};
const kid = () => (cfg().childName||"").trim();
const kidPoss = () => kid() ? kid()+"'s" : "Your child's";
const sup = () => ({ name:(cfg().supplierName||"").trim()||"your supplier", phone:(cfg().supplierPhone||"").trim() });
const leadDays = () => Math.max(0, Number(cfg().leadDays ?? 7));
const mixOptions = () => { const m=(plan().mixOptions||[]).filter(Boolean); return m.length ? m.concat(m.includes("Other")?[]:["Other"]) : ["Formula","Other"]; };
const DEFAULT_TERMS = [["G-tube","A feeding tube placed through the belly straight into the stomach."],["NG tube","A thin tube that goes through the nose into the stomach."],["MIC-KEY button","A low-profile G-tube that sits flat on the skin. An extension set clicks on for each feed."],["Extension set","The short tube that connects the button to the feeding bag or syringe."],["ENFit","A connector standard for feeding tubes so they can't be hooked up to IV lines by mistake."],["Pump rate (mL/hr)","How fast the pump delivers formula. For example, at 330 mL/hr a 240 mL feed takes about 44 minutes."],["Bolus feed","A feed given over a short time, by syringe or pump, instead of slowly over hours."],["Flush","Pushing water through the tube to keep it clear and add hydration."],["Granulation tissue","Pink or red, moist, bumpy tissue that can grow around the tube site. Common, but it can bleed or leak."],["IDDSI levels","The scale for food and drink textures, from 0 (thin liquids) to 7 (regular food). Level 4 is a smooth purée."],["Dysphagia","Difficulty swallowing safely."],["Aspiration","When food or liquid goes below the vocal cords into the airway instead of the esophagus."],["Swallow study","An X-ray video of swallowing (VFSS) that shows where food and liquid go."],["kcal/mL","Calories per milliliter. A 1.2 kcal/mL formula has 1.2 calories in each mL."]];
const DEFAULT_BRIEF = { patient:[], next:[], known:[], terms:DEFAULT_TERMS };
function todayLogs(){ const k=viewKey(); return S.logs.filter(l=>l.day===k); }
function careRule(t){ const s=String(t); const mx=s.match(/max(?:imum)?\s*(\d+)/i), mn=s.match(/(?:at least|min(?:imum)?)\s*(\d+)/i);
  return { name:s.replace(/\s*\((?:[^)]*?(?:max|at least|min|as needed)[^)]*)\)\s*$/i,"").trim()||s, max:mx?+mx[1]:0, min:mn?+mn[1]:0 }; }
function feedMinutes(p){ return p.rateMlHr ? Math.round(p.volumeMl/p.rateMlHr*60) : 0; }
function nextOrder(){
  const all=Object.keys(S.supplies).map(id=>({id, s:S.supplies[id], st:supplyState(S.supplies[id])}));
  const needs=all.filter(x=>x.s.needNow).map(x=>x.s.name);
  const list=all.filter(x=>isFinite(x.st.daysLeft)&&!x.s.needNow);
  if(!list.length) return needs.length ? { needs, daysToOrder:0, state:"now", also:[], first:null } : null;
  list.sort((a,b)=>a.st.daysLeft-b.st.daysLeft);
  const first=list[0], daysToOrder=Math.floor(first.st.daysLeft-leadDays()), orderBy=addDays(new Date(), daysToOrder), runOut=addDays(new Date(), Math.floor(first.st.daysLeft));
  const also=list.slice(1).filter(x=>x.st.daysLeft-leadDays() <= daysToOrder+10).map(x=>x.s.name);
  const state = daysToOrder<=0 ? "now" : daysToOrder<=3 ? "soon" : "ok";
  return { first, daysToOrder, orderBy, runOut, also, state: needs.length?"now":state, needs };
}

    <div class="small">Order by <b>${fmtDate(n.orderBy)}</b>. ${esc(n.first.s.name)} will run out around ${fmtDate(n.runOut)} (${Math.floor(n.first.st.est)} left).</div>
    ${n.also.length?`<div class="small muted">Add to the same order: ${n.also.map(esc).join(", ")}</div>`:""}
    <div class="small muted">${leadDays()?`Orders are timed ${leadDays()} days before you run out, so shipping has time to arrive.`:""}</div>
    ${sup().phone?`<div class="row"><span class="num" style="font-weight:700;user-select:all">${esc(sup().phone)}</span>
        <button class="small" data-act="copy" data-text="${esc(sup().phone)}">Copy number</button>
        <button class="small" data-act="copyorder">Copy reorder list</button></div>`:`<div class="row"><button class="small" data-act="copyorder">Copy reorder list</button></div>`}
  </div>`;
}
function feedShare(f, product){ const mix = f.mix || plan().defaultMix || mixOptions()[0]; if(!mix.includes(product)) return 0; return mix.includes("+") ? 0.5 : 1; }
function feedUse(s, fromTs, toTs){
  const fs = S.logs.filter(l=>l.type==="feed" && l.ts>=fromTs && l.ts<=toTs);
  const ml = fs.reduce((a,f)=>a+(Number(f.amount)||0)*feedShare(f, s.product),0);
  return { units: s.mlPerUnit ? ml/s.mlPerUnit : 0, days: new Set(fs.map(f=>f.day)).size };
}
function supplyState(s){
  let est, rate;
  if(s.track==="open"){
    est = Math.max(0, Number(s.counted)||0);
    const opens = S.logs.filter(l=>l.type==="open" && l.supply===s.id && l.ts>=Date.now()-28*86400000);
    const span = opens.length ? Math.max(7, (Date.now()-Math.min(...opens.map(o=>o.ts)))/86400000) : 0;
    rate = opens.length ? opens.length/span : 0;
  } else if(s.track==="feeds"){
    const since = s.countedAt ? new Date(s.countedAt).getTime() : 0;
    est = Math.max(0, (Number(s.counted)||0) - feedUse(s, since, Date.now()).units);
    const wk = feedUse(s, Date.now()-7*86400000, Date.now());
    rate = wk.days ? wk.units/wk.days : 0;
  } else {
    const daysSince = s.countedAt ? (Date.now()-new Date(s.countedAt).getTime())/86400000 : 0;
    est = Math.max(0, (Number(s.counted)||0) - (Number(s.perDay)||0)*daysSince);
    rate = Number(s.perDay)||0;
  }
  const daysLeft = rate ? est/rate : Infinity;
  const lead = leadDays();
  const reorderBy = isFinite(daysLeft) ? addDays(new Date(), Math.floor(daysLeft - lead)) : null;
  const status = s.needNow ? "now" : !isFinite(daysLeft) ? "ok" : daysLeft <= lead ? "now" : daysLeft <= lead + 5 ? "soon" : "ok";
  return { est, daysLeft, reorderBy, status, rate };
}

function weekSummary(){
  const p=plan(), since=Date.now()-7*86400000, wk=S.logs.filter(l=>l.ts>=since);
  const days = new Set(wk.map(l=>l.day)).size || 0;
  const feeds = wk.filter(l=>l.type==="feed"), ml = feeds.reduce((a,l)=>a+(Number(l.amount)||0),0);
  return { days, feeds:feeds.length, avg: days?Math.round(ml/days):0, goal:p.feedsPerDay*p.volumeMl,
    rough: feeds.filter(f=>f.how==="Rough").length, vomit: wk.filter(l=>l.type==="vomit").length,
    oral: wk.filter(l=>l.type==="oral"||l.type==="food").length, oz: Math.round(wk.filter(l=>(l.type==="food")&&l.unit==="oz").reduce((a,l)=>a+(Number(l.amount)||0),0)*100)/100, notes: wk.filter(l=>l.note).slice(0,6) };
}

document.addEventListener("click", async e=>{
  const tab=e.target.closest("nav button"); if(tab){ S.tab=tab.dataset.tab; S.open=null; render(); window.scrollTo(0,0); return; }

  const a=b.dataset.act, id=b.dataset.id;
  if(a==="openfeed"){ const s=+b.dataset.slot; S.open = S.open===s?null:s; render(); }
  if(a==="day"){ const d=addDays(keyToDate(viewKey()), +b.dataset.delta), k=dayKey(d); if(k>dayKey()) return; S.viewDay = k===dayKey()?null:k; S.open=null; render(); }
  if(a==="goto"){ const k=b.dataset.day; S.viewDay = k===dayKey()?null:k; S.open=null; render(); }
  if(a==="today"){ S.viewDay=null; S.open=null; render(); }
  if(a==="opened"){ const cur=S.supplies[id]; if(!(Number(cur.counted)>0)){ toast("Count is already 0. Update the count first."); return; }
    const s2={...cur, counted:Number(cur.counted)-1}; delete s2.id; await saveDoc("supplies/"+id, s2, `${s2.counted} ${cur.unit||""} left`); await addLog({type:"open", supply:id, what:cur.name}); return; }
  if(a==="toggleneed"){ const s={...S.supplies[id], needNow:!S.supplies[id].needNow}; await saveDoc("supplies/"+id, s, s.needNow?"Added to next order":"Marked as stocked"); }
  if(a==="tabplan"){ S.tab="plan"; S.open=null; render(); window.scrollTo(0,0); return; }
  if(a==="savesettings"){ await saveDoc("app/settings", {...cfg(), childName:$("#s-k").value.trim(), caregiverName:$("#s-me").value.trim(), supplierName:$("#s-sn").value.trim(), supplierPhone:$("#s-sp").value.trim(), leadDays:Math.max(0,Number($("#s-ld").value)||0)}, "Saved"); return; }

    S.open=null; await saveDoc("supplies/"+sid, d, "Supply added"); return; }
  if(a==="delsup"){ if(S.open!=="del:"+id){ S.open="del:"+id; render(); return; } S.open=null; await S.db.doc("supplies/"+id).delete(); toast("Removed"); return; }
  if(a==="openaddorder"){ S.open="addorder"; render(); return; }
  if(a==="saveaddorder"){ const items=$("#ao-i").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{ const m=/^(\d+(?:\.\d+)?)\s*x?\s+(.*)$/i.exec(l); return m?{qty:Number(m[1]), name:m[2]}:{qty:"", name:l}; });
    const d={ date:$("#ao-d").value||dayKey(), number:$("#ao-n").value.trim(), note:$("#ao-x").value.trim(), items };

  if(a==="export"){ exportData(); return; }
  if(a==="doimport"){ LocalDB.replaceAll(S.pendingImport.docs); S.pendingImport=null; S.open=null; S.viewDay=null; toast("Backup loaded"); return; }
  if(a==="erase"){ if(S.open!=="erase"){ S.open="erase"; render(); return; } LocalDB.replaceAll({}); S.open=null; S.tab="today"; toast("Everything was erased"); return; }

    const key=b.dataset.key, base=key.startsWith("edit:") ? (S.logs.find(l=>l.id===key.slice(5))?.ts||Date.now()) : nowOnDay();
    const fields={amount:Number($("#amt").value)||0, mix:v("#mix"), how:v("#how"), note:$("#fnote").value.trim(), ts:tsFrom(base,$("#ftime").value)}; S.open=null;
    if(key.startsWith("edit:")) await updateLog(key.slice(5), fields);
    else await addLog({type:"feed", slot: key.startsWith("slot:") ? +key.slice(5) : null, ...fields}); }
  if(a==="undo"){ if(S.open==="care:"+id||S.open==="foodedit:"+id) S.open=null; delLog(id); }
  if(a==="editcare"){ S.open = S.open==="care:"+id ? null : "care:"+id; render(); }
  if(a==="savecare"){ const l=S.logs.find(x=>x.id===id); S.open=null; await updateLog(id,{ts:tsFrom(l?.ts||Date.now(), $("#ctime").value)}); }
  if(a==="care"){ const t=+b.dataset.task, r=careRule((plan().careTasks||[])[t]||""); const n=todayLogs().filter(l=>l.type==="care"&&l.task===t).length;
    if(r.max && n>=r.max){ toast(`Limit is ${r.max} a day`); return; } await addLog({type:"care", task:t, ts:nowOnDay()}); }
  if(a==="quick"){ const t=b.dataset.type;
    if(t==="wet"||t==="poop"){ return addLog({type:t}); }
    const ph={oral:"What and how much, e.g. 2 tsp Level 4 purée",flush:"mL of water, e.g. 60",vomit:"After which feed? How much?",note:"Anything worth telling the team"}[t];
    $("#quickform").innerHTML=`<div class="card stack" style="margin-top:10px"><label for="qv">${esc(logLabel({type:t}))}<input id="qv" placeholder="${esc(ph)}" ${t==="flush"?'type="number" inputmode="numeric"':""}></label>
      <label for="qtime">Time<input id="qtime" type="time" value="${hhmm(nowOnDay())}"></label>
      <div class="row"><button class="btn-primary" data-act="qsave" data-type="${t}">Save</button><button class="btn-ghost" data-act="qcancel">Cancel</button></div></div>`;
    $("#qv").focus(); }
  if(a==="qsave"){ const t=b.dataset.type, v=$("#qv").value.trim();
    const entry = t==="flush" ? {type:t, amount:Number(v)||0} : t==="note" ? {type:t, note:v} : t==="oral" ? {type:t, amount:v} : {type:t, note:v};
    entry.ts=tsFrom(nowOnDay(), $("#qtime").value); $("#quickform").innerHTML=""; await addLog(entry); }
  if(a==="qcancel") $("#quickform").innerHTML="";
  if(a==="recount"){ S.open = S.open==="sup:"+id?null:"sup:"+id; render(); }
  if(a==="savesup"){ const s={...S.supplies[id]}; s.counted=Number($("#c-"+id).value)||0; if(s.track==="feeds"){ s.mlPerUnit=Number($("#u-"+id).value)||0; s.mlPerUnitIsGuess=false; } else s.perDay=Number($("#u-"+id).value)||0; s.perOrder=Number($("#o-"+id).value)||0; s.countedAt=new Date().toISOString(); s.perDayIsGuess=false; if(s.counted>0) s.needNow=false;
    S.open=null; await saveDoc("supplies/"+id, s, "Saved"); }
  if(a==="received"){ const s={...S.supplies[id]}; const st=supplyState(s); s.counted=Math.floor(st.est)+(Number(s.perOrder)||0); s.countedAt=new Date().toISOString(); s.lastReceived=dayKey();
    await saveDoc("supplies/"+id, s, `Added ${s.perOrder} ${s.unit}`); }
  if(a==="copy") copy(b.dataset.text);
  if(a==="copyorder") copy(orderText());
  if(a==="copybrief") copy(briefText());
  if(a==="editbrief"){ S.open="brief"; render(); }
  if(a==="savebrief"){ const nb={...DEFAULT_BRIEF, ...(S.brief||{}), patient:$("#bp").value.split("\n").map(l=>{ const i=l.indexOf(":"); return i>0?[l.slice(0,i).trim(), l.slice(i+1).trim()]:[l.trim(),""]; }).filter(r=>r[0]), next:$("#bq").value.split("\n").map(s=>s.trim()).filter(Boolean), known:$("#bk").value.split("\n").map(s=>s.trim()).filter(Boolean)};
    S.open=null; await saveDoc("app/brief", nb, "Brief saved"); }
  if(a==="saveplan"){ const np={...plan(), feedsPerDay:Math.max(1,Number($("#p-n").value)||1), volumeMl:Number($("#p-v").value)||0, rateMlHr:Number($("#p-r").value)||0, waterMl:Number($("#p-w").value)||0,
      feedLabels:$("#p-l").value.split(",").map(s=>s.trim()).filter(Boolean), mixNote:$("#p-m").value.trim(), oralDiet:$("#p-o").value.trim(),
      flushNote:$("#p-f").value.trim(), meds:$("#p-x").value.split("\n").map(s=>s.trim()).filter(Boolean), equipment:$("#p-d").value.trim(), mixOptions:$("#p-mx").value.split(",").map(x=>x.trim()).filter(Boolean), defaultMix:$("#p-dm").value.trim(), careTasks:$("#p-c").value.split("\n").map(s=>s.trim()).filter(Boolean), updated:dayKey()};
    await saveDoc("app/plan", np, "Plan saved"); }
});
document.addEventListener("change", e=>{ if(e.target && e.target.id==="importfile" && e.target.files[0]){ importData(e.target.files[0]); e.target.value=""; } });
boot();
</script>
</body>
</html>
